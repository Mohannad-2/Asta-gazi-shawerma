<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDrinks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" rx="14" fill="url(#bgGradDrinks)"/>
  <ellipse cx="100" cy="132" rx="65" ry="8" fill="#CBD5E1" opacity="0.6"/>
  <!-- Soda Can -->
  <g transform="translate(62, 50)">
    <rect x="0" y="5" width="34" height="65" rx="5" fill="url(#canGrad)" stroke="#1E40AF" stroke-width="1.5"/>
    <ellipse cx="17" cy="5" rx="17" ry="4" fill="#93C5FD"/>
    <ellipse cx="17" cy="70" rx="17" ry="4" fill="#1E3A8A"/>
    <!-- Can text logo -->
    <path d="M7 35 Q17 25 27 35" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <circle cx="17" cy="48" r="4" fill="#EF4444"/>
  </g>
  <!-- Water Bottle -->
  <g transform="translate(108, 38)">
    <rect x="0" y="24" width="28" height="53" rx="4" fill="url(#bottleGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Bottle neck -->
    <rect x="6" y="10" width="16" height="15" rx="2" fill="url(#bottleGrad)"/>
    <!-- Blue cap -->
    <rect x="7" y="4" width="14" height="7" rx="2" fill="#0284C7"/>
    <!-- Water label -->
    <rect x="0" y="44" width="28" height="16" fill="#0EA5E9"/>
    <path d="M4 52 Q14 47 24 52" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  </g>
  <rect x="12" y="12" width="102" height="22" rx="6" fill="#0284C7"/>
  <text x="63" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">1–3 SAR • مشروبات 🥤</text>
</svg>
