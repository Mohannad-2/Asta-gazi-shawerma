<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" rx="14" fill="url(#bgGradBox)"/>
  <ellipse cx="100" cy="132" rx="75" ry="10" fill="#CBD5E1" opacity="0.6"/>
  <!-- Arabi Meal Box Container -->
  <rect x="25" y="45" width="150" height="75" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Cut Arabi Shawarma Pieces (Row 1) -->
  <g transform="translate(32, 52)">
    <!-- 4 cut pieces with filling exposed -->
    <rect x="0" y="0" width="18" height="26" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
    <ellipse cx="9" cy="13" rx="6" ry="10" fill="#78350F"/>
    <circle cx="9" cy="13" r="3" fill="#FFFFFF"/>
    
    <rect x="22" y="0" width="18" height="26" rx="4" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
    <ellipse cx="31" cy="13" rx="6" ry="10" fill="#78350F"/>
    <circle cx="31" cy="13" r="3" fill="#FBBF24"/>

    <rect x="44" y="0" width="18" height="26" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
    <ellipse cx="53" cy="13" rx="6" ry="10" fill="#78350F"/>

    <rect x="66" y="0" width="18" height="26" rx="4" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
    <ellipse cx="75" cy="13" rx="6" ry="10" fill="#78350F"/>
  </g>
  <!-- Fries Compartment (Row 2 / bottom left) -->
  <g transform="translate(32, 85)">
    <rect x="0" y="0" width="84" height="28" rx="4" fill="#FEF3C7"/>
    <!-- Golden potato sticks -->
    <rect x="5" y="4" width="22" height="5" rx="1.5" fill="#F59E0B" transform="rotate(-10 5 4)"/>
    <rect x="20" y="6" width="24" height="5" rx="1.5" fill="#FBBF24" transform="rotate(15 20 6)"/>
    <rect x="40" y="8" width="25" height="5" rx="1.5" fill="#F59E0B" transform="rotate(-5 40 8)"/>
    <rect x="58" y="5" width="20" height="5" rx="1.5" fill="#FBBF24" transform="rotate(20 58 5)"/>
  </g>
  <!-- 3 Sauce Cups (Toum, spicy, pickles) on right -->
  <g transform="translate(125, 52)">
    <!-- Toum -->
    <circle cx="20" cy="12" r="11" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="20" cy="12" r="8" fill="#FFFFFF"/>
    <!-- Spicy red sauce -->
    <circle cx="20" cy="38" r="11" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <circle cx="20" cy="38" r="8" fill="#DC2626"/>
    <!-- Pickles cup -->
    <circle cx="20" cy="64" r="11" fill="#F7FEE7" stroke="#D9F99D" stroke-width="1.5"/>
    <ellipse cx="20" cy="64" rx="5" ry="4" fill="#65A30D"/>
  </g>
  <rect x="12" y="12" width="124" height="22" rx="6" fill="#DC2626"/>
  <text x="74" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">6–30 Pcs • شاورما عربي 🍱</text>
</svg>
